name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

# Not `${{ github.workflow }}-…`: the reused pr.yml evaluates its own concurrency group with this
# workflow's name ("Release-<ref>"), and the same group (names ignore case) would deadlock.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jeda777/docgraph

jobs:
  # Only commits on main are released, and the moving tags (`latest`, `1`, `1.2`) only move
  # forward: a tag that is not the highest stable version of its line leaves them where they are.
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.rank.outputs.latest }}
      major: ${{ steps.rank.outputs.major }}
      minor: ${{ steps.rank.outputs.minor }}
    steps:
      - name: Check the ref is main or a tag
        if: github.ref != 'refs/heads/main' && github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on main or push a v*.*.* tag (got $GITHUB_REF)."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Release only commits merged to main."
            exit 1
          fi

      - name: Rank the tag among stable versions
        id: rank
        if: github.ref_type == 'tag'
        run: |
          version=${GITHUB_REF_NAME#v}
          major=${version%%.*}
          minor_rest=${version#*.}
          minor=$major.${minor_rest%%.*}
          # Highest plain vX.Y.Z tag matching the pattern; pre-releases never count.
          highest() {
            git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          }
          is_highest() {
            if [ "$(highest "$1")" = "$GITHUB_REF_NAME" ]; then echo true; else echo false; fi
          }
          {
            echo "latest=$(is_highest 'v*')"
            echo "major=$(is_highest "v$major.*")"
            echo "minor=$(is_highest "v$minor.*")"
          } | tee -a "$GITHUB_OUTPUT"

  # The full PR pipeline (lint, build, unit and E2E tests) on the tagged commit. Turbo replays
  # unchanged tasks from the cache saved on main, so a tag on an already-tested commit is quick.
  ci:
    name: CI
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read

  # Each platform builds on a native runner: emulating arm64 with QEMU is several times slower,
  # especially if argon2 has to compile from source. The per-platform images are pushed by
  # digest only and joined into one multi-arch tag by the `merge` job.
  build:
    name: Build (${{ matrix.platform }})
    needs: [verify, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # v1.2.3 → 1.2.3, plus 1.2, 1 and latest when it is the highest stable version of that
      # line (see `verify`); no `1` for 0.x. A pre-release (v1.2.3-beta.1) gets only its own tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.verify.outputs.major == 'true' && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest == 'true' }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
