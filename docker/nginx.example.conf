# Example nginx reverse proxy for DocGraph. Replace docs.example.com and the certificate
# paths, and set APP_URL=https://docs.example.com in the app's environment.
# Security headers come from the app: don't add them here.

server {
    listen 80;
    server_name docs.example.com;
    # Fine with `certbot --nginx`; certbot's webroot mode also needs a
    # `location /.well-known/acme-challenge/ { root ...; }` here
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on; # nginx >= 1.25.1; older versions: `listen 443 ssl http2;`
    server_name docs.example.com;

    ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;

    # MCP requests carry whole documents (the app limits them to 100 MB)
    client_max_body_size 100m;

    # Behind a CDN or load balancer, $remote_addr is its address, not the client's: restore the
    # client address with ngx_http_realip_module, trusting only the intermediary's ranges, e.g.
    #   set_real_ip_from 203.0.113.0/24;
    #   real_ip_header   X-Forwarded-For;   # Cloudflare: CF-Connecting-IP
    #   real_ip_recursive on;

    # Login is rate-limited per client IP: overwrite X-Forwarded-For, don't append to it
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Real-time collaboration WebSocket, open as long as a document is.
    # proxy_set_header here replaces the server-level ones, so they are repeated.
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
    }
}
